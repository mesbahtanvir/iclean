name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: No networking APIs
        run: scripts/check-no-network.sh
      - name: Lint
        run: scripts/lint.sh
      - name: CleanupKit tests
        run: swift test --package-path Packages/CleanupKit --skip AccuracyTests
