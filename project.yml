name: iclean
options:
  bundleIdPrefix: com.mesbahtanvir
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
packages:
  CleanupKit:
    path: Packages/CleanupKit
targets:
  iclean:
    type: application
    # 005: one app target for iPhone and Mac (native, not Catalyst).
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: iclean
        # The Mac plist and entitlements are referenced by build settings below, not bundled.
        excludes: ["Info-macOS.plist", "*.entitlements"]
    dependencies:
      - package: CleanupKit
      # Developer tooling: the baseline test photo library. It is linked in every configuration
      # (XcodeGen cannot scope a package dependency by configuration), but the app only references
      # it from `#if DEBUG` code, so a Release build cannot reach it.
      - package: CleanupKit
        product: BaselineKit
    info:
      path: iclean/Info.plist
      properties:
        CFBundleDisplayName: iclean
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: "iclean looks through your photos to find duplicates, similar shots, blurry photos, screenshots and large videos. You choose what to remove, and nothing leaves your iPhone."
        ITSAppUsesNonExemptEncryption: false
        # 002: a user-started scan may continue after the user leaves the app
        # (continued processing task, iOS 26+). Not a network entitlement.
        BGTaskSchedulerPermittedIdentifiers: ["com.mesbahtanvir.iclean.scan.*"]
        UIBackgroundModes: [processing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mesbahtanvir.iclean
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The accent colour of the app: only used through Color.accentColor and .tint (spec 009).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # iPhone only for now (iPad is spec 005 stage S1); `supportedDestinations` would
        # otherwise widen this to "1,2".
        TARGETED_DEVICE_FAMILY: "1"
        # The iPhone build is not offered on the Mac as a "Designed for iPad" app (005 R7).
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # Mac: Apple silicon only, hardened runtime, sandbox with the Photos library permission
        # and no network entitlement (scripts/check-no-network.sh enforces that).
        "ARCHS[sdk=macosx*]": arm64
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        "INFOPLIST_FILE[sdk=macosx*]": iclean/Info-macOS.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": iclean/iclean-macOS.entitlements
  # Unit tests of the app's own logic (formatting and the like), hosted in the app. The model and
  # the detectors are tested in the CleanupKit package; this is for what lives in the app target.
  icleanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: icleanTests
    dependencies:
      - target: iclean
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mesbahtanvir.icleanTests
        GENERATE_INFOPLIST_FILE: YES
  icleanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: icleanUITests
        excludes: ["*.xctestplan"]
    dependencies:
      - target: iclean
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mesbahtanvir.icleanUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: iclean
schemes:
  iclean:
    build:
      targets:
        iclean: all
        icleanTests: [test]
        icleanUITests: [test]
    test:
      testPlans:
        - path: icleanUITests/Default.xctestplan
          defaultPlan: true
        - path: icleanUITests/NoNetwork.xctestplan
